<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataBate</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem;
      background: #f4f4f5;
      color: #18181b;
    }

    h1 { margin-top: 0; font-size: 1.5rem; }

    section {
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    h2 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      margin-bottom: 0.25rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 0.75rem;
      border: 1px solid #d4d4d8;
      border-radius: 6px;
      font: inherit;
    }

    textarea { min-height: 80px; resize: vertical; }

    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    button.secondary {
      background: #71717a;
    }

    button.secondary:hover { background: #52525b; }

    .row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .hidden { display: none; }

    .status {
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
    }

    .status.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .status.success {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .post {
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .post:last-child { margin-bottom: 0; }

    .post-title {
      font-weight: 600;
      margin: 0 0 0.25rem;
    }

    .post-content {
      margin: 0 0 0.5rem;
      color: #3f3f46;
      white-space: pre-wrap;
    }

    .post-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8125rem;
      color: #71717a;
    }

    .vote-btn {
      padding: 0.25rem 0.75rem;
      font-size: 0.875rem;
    }

    .empty {
      color: #71717a;
      font-size: 0.875rem;
      margin: 0;
    }

    .logged-in-as {
      font-size: 0.875rem;
      color: #52525b;
      margin: 0 0 0.75rem;
    }
  </style>
</head>
<body>
  <h1>DataBate</h1>
  <p style="font-size: 0.875rem; color: #71717a; margin-top: -0.5rem;">
    Databate frontend demo 
  </p>

  <div id="status" class="status hidden"></div>

  <!-- Auth -->
  <section id="auth-section">
    <h2>Login or register</h2>
    <div id="login-form">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" placeholder="you@example.com" />

      <label for="login-password">Password</label>
      <input id="login-password" type="password" placeholder="password" />

      <div class="row">
        <button id="login-btn" type="button">Login</button>
        <button id="show-register-btn" type="button" class="secondary">Register instead</button>
      </div>
    </div>

    <div id="register-form" class="hidden">
      <label for="register-email">Email</label>
      <input id="register-email" type="email" placeholder="you@example.com" />

      <label for="register-password">Password</label>
      <input id="register-password" type="password" placeholder="password" />

      <div class="row">
        <button id="register-btn" type="button">Create account</button>
        <button id="show-login-btn" type="button" class="secondary">Back to login</button>
      </div>
    </div>
  </section>

  <!-- App (shown after login) -->
  <section id="app-section" class="hidden">
    <p class="logged-in-as">Logged in as <strong id="user-email"></strong></p>
    <button id="logout-btn" type="button" class="secondary">Logout</button>
  </section>

  <section id="create-section" class="hidden">
    <h2>Create a post</h2>
    <label for="post-title">Title</label>
    <input id="post-title" type="text" placeholder="Post title" />

    <label for="post-content">Content</label>
    <textarea id="post-content" placeholder="What's on your mind?"></textarea>

    <button id="create-post-btn" type="button">Post</button>
  </section>

  <section id="posts-section" class="hidden">
    <h2>Posts</h2>
    <div id="posts-list">
      <p class="empty">No posts yet.</p>
    </div>
  </section>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    const els = {
      status: document.getElementById("status"),
      authSection: document.getElementById("auth-section"),
      appSection: document.getElementById("app-section"),
      createSection: document.getElementById("create-section"),
      postsSection: document.getElementById("posts-section"),
      loginForm: document.getElementById("login-form"),
      registerForm: document.getElementById("register-form"),
      postsList: document.getElementById("posts-list"),
      userEmail: document.getElementById("user-email"),
    };

    function showStatus(message, type = "error") {
      els.status.textContent = message;
      els.status.className = `status ${type}`;
      els.status.classList.remove("hidden");
    }

    function clearStatus() {
      els.status.classList.add("hidden");
    }

    function getToken() {
      return localStorage.getItem("token");
    }

    function setToken(token) {
      localStorage.setItem("token", token);
    }

    function clearToken() {
      localStorage.removeItem("token");
      localStorage.removeItem("email");
    }

    function authHeaders(json = true) {
      const headers = { Authorization: `Bearer ${getToken()}` };
      if (json) headers["Content-Type"] = "application/json";
      return headers;
    }

    async function apiError(res) {
      let detail = `Request failed (${res.status})`;
      try {
        const data = await res.json();
        if (data.detail) {
          detail = typeof data.detail === "string"
            ? data.detail
            : JSON.stringify(data.detail);
        }
      } catch (_) {}
      throw new Error(detail);
    }

    function showLoggedIn(email) {
      els.authSection.classList.add("hidden");
      els.appSection.classList.remove("hidden");
      els.createSection.classList.remove("hidden");
      els.postsSection.classList.remove("hidden");
      els.userEmail.textContent = email;
    }

    function showLoggedOut() {
      els.authSection.classList.remove("hidden");
      els.appSection.classList.add("hidden");
      els.createSection.classList.add("hidden");
      els.postsSection.classList.add("hidden");
      els.loginForm.classList.remove("hidden");
      els.registerForm.classList.add("hidden");
      els.postsList.innerHTML = '<p class="empty">No posts yet.</p>';
    }

    async function login() {
      clearStatus();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      if (!email || !password) {
        showStatus("Enter email and password.");
        return;
      }

      const body = new URLSearchParams({ username: email, password });

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body,
        });

        if (!res.ok) await apiError(res);

        const data = await res.json();
        setToken(data.access_token);
        localStorage.setItem("email", email);
        showLoggedIn(email);
        showStatus("Logged in.", "success");
        await loadPosts();
      } catch (err) {
        showStatus(err.message);
      }
    }

    async function register() {
      clearStatus();
      const email = document.getElementById("register-email").value.trim();
      const password = document.getElementById("register-password").value;

      if (!email || !password) {
        showStatus("Enter email and password.");
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/users/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        if (!res.ok) await apiError(res);

        showStatus("Account created — you can log in now.", "success");
        els.registerForm.classList.add("hidden");
        els.loginForm.classList.remove("hidden");
        document.getElementById("login-email").value = email;
      } catch (err) {
        showStatus(err.message);
      }
    }

    async function loadPosts() {
      try {
        const res = await fetch(`${API_BASE}/posts/`, {
          headers: authHeaders(false),
        });

        if (res.status === 401) {
          clearToken();
          showLoggedOut();
          showStatus("Session expired — please log in again.");
          return;
        }

        if (!res.ok) await apiError(res);

        const posts = await res.json();
        renderPosts(posts);
      } catch (err) {
        showStatus(err.message);
      }
    }

    function renderPosts(posts) {
      if (!posts.length) {
        els.postsList.innerHTML = '<p class="empty">No posts yet.</p>';
        return;
      }

      els.postsList.innerHTML = posts.map((item) => {
        const post = item.Post;
        const votes = item.votes ?? 0;
        const ownerEmail = post.owner?.email ?? "unknown";

        return `
          <article class="post" data-post-id="${post.id}">
            <p class="post-title">${escapeHtml(post.title)}</p>
            <p class="post-content">${escapeHtml(post.content)}</p>
            <div class="post-meta">
              <span>by ${escapeHtml(ownerEmail)}</span>
              <button class="vote-btn" data-vote-id="${post.id}" type="button">▲ ${votes}</button>
            </div>
          </article>
        `;
      }).join("");

      els.postsList.querySelectorAll(".vote-btn").forEach((btn) => {
        btn.addEventListener("click", () => upvote(Number(btn.dataset.voteId)));
      });
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    async function createPost() {
      clearStatus();
      const title = document.getElementById("post-title").value.trim();
      const content = document.getElementById("post-content").value.trim();

      if (!title || !content) {
        showStatus("Title and content are required.");
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/posts/`, {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ title, content, published: true }),
        });

        if (!res.ok) await apiError(res);

        document.getElementById("post-title").value = "";
        document.getElementById("post-content").value = "";
        showStatus("Post created.", "success");
        await loadPosts();
      } catch (err) {
        showStatus(err.message);
      }
    }

    async function upvote(postId) {
      clearStatus();

      try {
        const res = await fetch(`${API_BASE}/vote/`, {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ post_id: postId, direction: 1 }),
        });

        if (!res.ok) await apiError(res);

        showStatus("Upvoted.", "success");
        await loadPosts();
      } catch (err) {
        showStatus(err.message);
      }
    }

    function logout() {
      clearToken();
      showLoggedOut();
      clearStatus();
    }

    document.getElementById("login-btn").addEventListener("click", login);
    document.getElementById("register-btn").addEventListener("click", register);
    document.getElementById("create-post-btn").addEventListener("click", createPost);
    document.getElementById("logout-btn").addEventListener("click", logout);

    document.getElementById("show-register-btn").addEventListener("click", () => {
      els.loginForm.classList.add("hidden");
      els.registerForm.classList.remove("hidden");
      clearStatus();
    });

    document.getElementById("show-login-btn").addEventListener("click", () => {
      els.registerForm.classList.add("hidden");
      els.loginForm.classList.remove("hidden");
      clearStatus();
    });

    // Restore session on page load
    if (getToken() && localStorage.getItem("email")) {
      showLoggedIn(localStorage.getItem("email"));
      loadPosts();
    }
  </script>
</body>
</html>
